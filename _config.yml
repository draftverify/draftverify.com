title: DraftVerify
description: Independent identification and verification standard for non-alcoholic draft systems.
url: https://www.draftverify.com
timezone: America/Toronto

markdown: kramdown
highlighter: none

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md

defaults:
  - scope: { path: "" }
    values:
      layout: default
      image: /logo-social.png
